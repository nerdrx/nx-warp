<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX Warp">
  <title>NX Warp</title>
<!--
  NX Warp. The NX family crystal - a pointy-top beveled glass hexagon around a
  sunken lit well - with a warp monogram sculpted from the same glass.

  The monogram is a 4x4 tile grid under a reprojection. It enters at the left
  square, the way the frame was rendered, and leaves at the right sheared,
  shortened and bowed, the way the pose warp puts it back down. Two tiles are
  lit: the codec refreshes tiles, not frames.

  Construction, from the outside in:

  1. Bevel. Six faces, each a quad from the outer hexagon to the inner one,
     toned by 0.5 + 0.5*dot(face normal, light) with the light arriving from
     the upper left, mapped through one violet ramp. Same solid as every other
     NX mark, so the family reads as one material.
  2. Well. A radial violet-to-near-black field lit violet up-left and cyan
     down-right, with four specks of dust and a rim seam that goes black where
     the wall turns away and violet where it bounces back.
  3. Refraction. Cyan on the inner lip of the three faces facing the light, a
     hard white line along the outer silhouette on the same side.
  4. Grid. Every line is a polyline through the warp function written below,
     stroked as a cyan casing under a white-to-violet face. No <text>, no font,
     no traced outlines.

     X(u)   = 150 + 216 * (1.15u - 0.15u^2)
     Y(u,v) = (256 - 22u) + (v - 0.5) * 190 * (1 - 0.34u)
                          + 28 * (v - 0.5) * u * (1 - u)

  Below 48px this file is not used: nx-warp-mark-small.svg drops the bevel,
  the well and the casing, because at 16px all three land inside one pixel.
-->
