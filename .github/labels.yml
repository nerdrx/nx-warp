# NX Warp label set — the single source of truth.
# .github/workflows/labels.yml syncs the repository to this file on push to main.
# Colours: area:* is the NX violet family (#7700FF and neighbours), type:risk and
# needs-fto-review are amber, P0 is red. See .github/PROCESS.md for what they mean.

# ---------------------------------------------------------------- area
- name: "area:bitstream"
  color: "7700FF"
  description: "Syntax, entropy coding, transform, quantization (paper 1)"
- name: "area:prediction"
  color: "8A2BE2"
  description: "Pose warp, motion vectors, references, concealment (paper 2)"
- name: "area:transport"
  color: "9B4DFF"
  description: "Datagrams, FEC, pacing, multipath, telemetry (paper 4)"
- name: "area:ratecontrol"
  color: "6A0DAD"
  description: "Bit allocation, degradation ladder, decode-time governor (paper 4.6)"
- name: "area:vulkan"
  color: "5B21B6"
  description: "GPU encoder and decoder, GLSL kernels, device probe (paper 3)"
- name: "area:android"
  color: "A56BFF"
  description: "Pico 4 / XR2 client, MediaCodec, AHardwareBuffer, NDK"
- name: "area:windows"
  color: "B388FF"
  description: "Windows port, mingw cross-build, D3D interop"
- name: "area:wivrn"
  color: "4C1D95"
  description: "WiVRn NX integration, server and client plumbing"
- name: "area:tools"
  color: "C4A2FF"
  description: "Quality harness, conformance vectors, fuzzers, simulators"
- name: "area:docs"
  color: "D6C2FF"
  description: "Paper, READMEs, integration notes"
- name: "area:spec"
  color: "7C3AED"
  description: "Normative syntax document and the reference codec as spec"
- name: "area:ci"
  color: "9D8DF1"
  description: "GitHub Actions, runners, build matrix"

# ---------------------------------------------------------------- type
- name: "type:bug"
  color: "E11D48"
  description: "Something behaves differently from the reference or the spec"
- name: "type:feature"
  color: "0E7490"
  description: "New capability to build"
- name: "type:experiment"
  color: "0891B2"
  description: "Measure something and record the number"
- name: "type:risk"
  color: "F59E0B"
  description: "An open risk from the paper, with a kill or verify test"
- name: "type:decision"
  color: "4B5563"
  description: "A choice to make and record; closing it means an ADR"

# ---------------------------------------------------------------- phase
- name: "phase:0"
  color: "C7D2FE"
  description: "Phase 0 — Adreno compute gate"
- name: "phase:1"
  color: "A5B4FC"
  description: "Phase 1 — intra-only codec"
- name: "phase:2"
  color: "818CF8"
  description: "Phase 2 — pose-warped inter"
- name: "phase:3"
  color: "6366F1"
  description: "Phase 3 — WiVRn NX integration"
- name: "phase:4"
  color: "4F46E5"
  description: "Phase 4 — stereo, foveation, depth"

# ---------------------------------------------------------------- priority
- name: "P0"
  color: "D73A4A"
  description: "Blocks the current phase gate"
- name: "P1"
  color: "F97316"
  description: "Needed for the current phase to exit"
- name: "P2"
  color: "FBBF24"
  description: "Wanted, not gating"
- name: "P3"
  color: "E5E7EB"
  description: "Nice to have, or a later phase"

# ---------------------------------------------------------------- status
- name: "needs-hardware"
  color: "1F6FEB"
  description: "Cannot be finished without a Pico 4, a Windows box or a specific GPU"
- name: "needs-fto-review"
  color: "B45309"
  description: "Freedom-to-operate review item (paper 6.12)"
- name: "blocked"
  color: "6E7781"
  description: "Waiting on another issue or an outside answer"

# ---------------------------------------------------------------- contribution
- name: "good-first-issue"
  color: "7057FF"
  description: "Self-contained, well specified, no hardware needed"
- name: "help-wanted"
  color: "008672"
  description: "Extra attention or a device we do not have"
