# Build the Material for MkDocs site and publish it to GitHub Pages.
#
# Pull requests build the site but do not deploy, so a broken docs change is
# caught before it reaches main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "*.md"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date plugins need history if added later

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          # Mermaid is rendered by Material's native superfences support, so no
          # mermaid2 plugin is required.
          pip install "mkdocs-material>=9.5"

      - name: Build
        run: mkdocs build --verbose

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Non-fatal until GitHub Pages is enabled in the repository settings.
    continue-on-error: true
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
