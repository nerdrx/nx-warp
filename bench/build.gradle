// NX Warp Phase 0 bench: one Gradle module, no Java sources, NativeActivity.
// Conventions follow wivrn-nx/client so the same toolchain on this machine
// builds both.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}

allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: 'com.android.application'

android {
    namespace = "org.nxwarp.bench"
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId "org.nxwarp.bench"
        // API 29: AImageReader_newWithUsage, AHardwareBuffer import, Vulkan 1.1
        minSdkVersion 29
        compileSdkVersion 34
        targetSdkVersion 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_TOOLCHAIN=clang',
                          '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release'
                abiFilters 'arm64-v8a'
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = []
            res.srcDirs = []
            assets.srcDirs = ['assets']
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.31.5'
            path 'CMakeLists.txt'
        }
    }

    buildTypes {
        debug {
            // Debug is deliberate: the APK is unsigned-release-free, installs
            // with the debug key, and needs no signing config on this machine.
            jniDebuggable false
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}
