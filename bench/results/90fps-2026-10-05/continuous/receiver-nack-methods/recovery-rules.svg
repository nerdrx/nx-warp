<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#101221"/><g font-family="sans-serif" fill="#f5f3ff"><text x="30" y="40" font-size="25">Receiver repair rules — exercised methods, not latency measurements</text><text x="30" y="70" font-size="15" fill="#b8b4d0">Existing quiet period: 2.5 ms • Maximum: two request rounds • Deterministic virtual-time fixtures</text><g fill="#222638" stroke="#9f8aff"><rect x="30" y="105" width="290" height="160" rx="12"/><rect x="355" y="105" width="290" height="160" rx="12"/><rect x="680" y="105" width="290" height="160" rx="12"/></g><text x="48" y="139" font-size="20">Confirmed missing shard</text><text x="48" y="172" font-size="14">Before quiet boundary: no NACK</text><text x="48" y="201" font-size="14">At boundary: request known hole</text><text x="48" y="230" font-size="14">Two rounds spent: stop retrying</text><text x="373" y="139" font-size="20">Parity + late reply</text><text x="373" y="172" font-size="14">Parity repairs shard 1 first</text><text x="373" y="201" font-size="14">Request only remaining shard 2</text><text x="373" y="230" font-size="14">Reply completes frame: no retry</text><text x="698" y="139" font-size="20">Unknown newest tail</text><text x="698" y="172" font-size="14">Silence does not reveal frame size</text><text x="698" y="201" font-size="14">No speculative tail request</text><text x="698" y="230" font-size="14">Newer data permits older-tail guess</text><text x="30" y="309" font-size="14" fill="#b8b4d0">Real method bodies + shard/window/FEC helpers; fake configuration and send callback.</text><text x="30" y="337" font-size="14" fill="#b8b4d0">No sockets, network loop, Android property, rendering, headset or measured recovery improvement.</text></g></svg>
