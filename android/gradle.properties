# NX Warp Android client -- build tuning.
#
# CPU discipline: this project shares a workstation with encoder benchmarks and
# a live desktop session. Four workers, and the native build is told -j4 in
# CMakeLists.txt as well, so a Gradle build never takes more than about four
# cores even when CMake and Gradle overlap.
org.gradle.workers.max=4
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

android.useAndroidX=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34
